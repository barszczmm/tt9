name: Build APK

# Runs only when started manually: Actions → "Build APK" → "Run workflow".
# The upstream workflows (build.yml, close-stale-issues.yml) are kept unchanged, to avoid merge
# conflicts when syncing with upstream. Disable them from the Actions tab instead.
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type. 'release' requires the signing secrets (see below)."
        type: choice
        options:
          - release
          - debug
        default: release
      languages:
        description: "Languages to include, separated by spaces, as named in app/languages/definitions (without .yml). English is always included. Leave empty for all languages."
        type: string
        default: "English Polish"

permissions:
  contents: read

# Signing secrets (Settings → Secrets and variables → Actions), required for 'release':
#   TT9_KEYSTORE_BASE64   - the keystore file, base64-encoded (base64 -w0 my-key.jks)
#   TT9_KEYSTORE_PASSWORD - the keystore password
#   TT9_KEY_ALIAS         - the key alias
#   TT9_KEY_PASSWORD      - the key password
#
# 'debug' builds are signed with a random key generated on each run, so a newer debug build can not
# be installed over an older one without uninstalling it first.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    # setup
    - name: Checkout project sources
      uses: actions/checkout@v5
      with:
        # The version name and code are computed from the git tags and the commit count, and the
        # dictionary properties from the git history, so the full history is required.
        fetch-depth: 0
        fetch-tags: true
    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 21
    # The gradle-wrapper.jar in the repository is a very old development build, which is not on the
    # list of official checksums and fails the wrapper validation. So, instead of running it, we
    # install the official Gradle release that the wrapper would use, and run it directly.
    - name: Read the Gradle version
      id: gradle-version
      run: |
        version=$(sed -n 's/^distributionUrl=.*gradle-\([0-9][0-9.]*\)-\(bin\|all\)\.zip$/\1/p' gradle/wrapper/gradle-wrapper.properties)
        if [ -z "$version" ]; then
          echo "::error::Could not read the Gradle version from gradle/wrapper/gradle-wrapper.properties"
          exit 1
        fi
        echo "Gradle version: $version"
        echo "version=$version" >> "$GITHUB_OUTPUT"
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: ${{ steps.gradle-version.outputs.version }}
        validate-wrappers: false # the wrapper is not used, see above

    - name: Prepare the signing key
      if: inputs.build_type == 'release'
      env:
        TT9_KEYSTORE_BASE64: ${{ secrets.TT9_KEYSTORE_BASE64 }}
      run: |
        if [ -z "$TT9_KEYSTORE_BASE64" ]; then
          echo "::error::The TT9_KEYSTORE_BASE64 secret is not set. Add the signing secrets or run a 'debug' build."
          exit 1
        fi
        echo "$TT9_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
        echo "TT9_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

    # Remove the unwanted languages from this temporary checkout only, so that they are not
    # validated, built or packed into the APK. The repository is not modified.
    - name: Remove the unused languages
      if: inputs.languages != ''
      env:
        LANGUAGES: ${{ inputs.languages }}
      run: |
        set -euo pipefail
        cd app/languages
        keep=" English $LANGUAGES "

        for name in $LANGUAGES; do
          if [ ! -f "definitions/$name.yml" ]; then
            echo "::error::Unknown language: '$name'. Available: $(cd definitions && ls *.yml | sed 's/\.yml$//' | tr '\n' ' ')"
            exit 1
          fi
        done

        for file in definitions/*; do
          name=$(basename "${file%.*}")
          case "$keep" in *" $name "*) ;; *) rm "$file" ;; esac
        done

        # keep only the dictionary and n-gram files referenced by the remaining definitions
        files=$(sed -n 's/^\(dictionaryFile\|ngramFile\):[[:space:]]*\([^[:space:]#]*\).*/\2/p' definitions/*.yml)
        keep_files=" "
        for f in $files; do keep_files+="$f ${f%.*}.zip "; done

        for file in dictionaries/* ngrams/* ../../downloads/*; do
          case "$keep_files" in *" $(basename "$file") "*) ;; *) rm -rf "$file" ;; esac
        done

        echo "Languages: $(cd definitions && ls | sed 's/\.yml$//' | tr '\n' ' ')"
        echo "Dictionary files: $(ls dictionaries ngrams ../../downloads | tr '\n' ' ')"

    # validate and build
    - name: Generate Documents
      run: gradle generateDocs
    - name: Validate Dictionaries
      run: gradle validateLanguages
    - name: Build Languages
      run: gradle buildDefinition buildDictionaryDownloads
    - name: Copy Downloads
      run: gradle copyDownloadsToAssets
    - name: Build the 'Full' APK
      env:
        TT9_KEYSTORE_PASSWORD: ${{ secrets.TT9_KEYSTORE_PASSWORD }}
        TT9_KEY_ALIAS: ${{ secrets.TT9_KEY_ALIAS }}
        TT9_KEY_PASSWORD: ${{ secrets.TT9_KEY_PASSWORD }}
      run: gradle ${{ inputs.build_type == 'release' && 'assembleFullRelease' || 'assembleFullDebug' }}

    - name: Remove the signing key
      if: always()
      run: rm -f "$RUNNER_TEMP/release.jks"

    # Upload the APK as it is, without zipping it. The artifact is named after the APK file.
    - name: Upload the APK
      uses: actions/upload-artifact@v7
      with:
        path: app/build/outputs/apk/full/${{ inputs.build_type }}/*.apk
        archive: false
        if-no-files-found: error
